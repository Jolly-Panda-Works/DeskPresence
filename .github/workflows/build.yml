name: Build Windows EXE and Release

# Every push builds the exe. Pushes to main also get an automatic version number,
# a git tag and a public GitHub Release with DeskPresence.exe attached.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch makes an older, still-running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      # One version number for everything: About window, exe properties and the release name.
      #   main      -> MAJOR.MINOR.<run number>    e.g. 1.1.42
      #   tag vX.Y.Z -> X.Y.Z
      #   other     -> MAJOR.MINOR.0-dev.<run>     e.g. 1.1.0-dev.43
      - name: Decide the version
        id: ver
        shell: bash
        run: |
          version=$(python tools/set_version.py --ci "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          echo "Building DeskPresence $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download face model
        run: python scripts/download_model.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DeskPresence
          --icon assets/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          --collect-submodules winrt
          --hidden-import pystray._win32
          run.py

      - name: Create checksum
        run: |
          Get-FileHash dist\DeskPresence.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  DeskPresence.exe" } | Set-Content -Encoding ascii SHA256SUMS.txt

      # Every build (any branch, pull requests, main, tags) keeps its output for two weeks:
      # Actions -> the run -> Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPresence-${{ steps.ver.outputs.version }}
          path: |
            dist/DeskPresence.exe
            SHA256SUMS.txt
          retention-days: 14

      - name: Tag this build
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        shell: bash
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "DeskPresence $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DeskPresence v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/DeskPresence.exe
            SHA256SUMS.txt
