name: Build and Release

# Every push builds the Windows app (installer + portable zip) and the Android app (APK).
# Pushes to main also get an automatic version number, a git tag and a public GitHub Release.
on:
  push:
    # Dependabot branches are built through their pull request instead
    branches: ["**", "!dependabot/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch makes an older, still-running build pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt pyinstaller

      - name: Run tests
        run: python -m pytest -q

      # One version number for everything: About window, exe properties and the release name.
      #   main      -> MAJOR.MINOR.<run number>    e.g. 1.1.42
      #   tag vX.Y.Z -> X.Y.Z
      #   other     -> MAJOR.MINOR.0-dev.<run>     e.g. 1.1.0-dev.43
      - name: Decide the version
        id: ver
        shell: bash
        run: |
          version=$(python tools/set_version.py --ci "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          echo "Building DeskPresence $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download face models
        run: python scripts/download_model.py

      # --onedir starts much faster than --onefile (nothing to unpack on every launch);
      # the installer and the portable zip both ship this folder.
      - name: Build app
        run: >
          pyinstaller --noconfirm --onedir --windowed --name DeskPresence
          --icon assets/icon.ico
          --version-file version_info.txt
          --add-data "assets;assets"
          --collect-submodules winrt
          --collect-all mediapipe
          --collect-data customtkinter
          --hidden-import pystray._win32
          --hidden-import pycaw.pycaw
          --collect-submodules zeroconf
          run.py

      - name: Smoke test the build
        shell: pwsh
        run: |
          $p = Start-Process dist\DeskPresence\DeskPresence.exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }

      # Inno Setup is preinstalled on GitHub's Windows runners; install it only if it is ever missing.
      - name: Make sure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          # Persian setup wizard (unofficial Inno Setup translation); English only if it is unavailable
          try {
            Invoke-WebRequest https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Farsi.isl -OutFile Farsi.isl
          } catch { Write-Warning "Farsi.isl not available" }
          & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss
          if ($LASTEXITCODE -ne 0 -and (Test-Path Farsi.isl)) {
            Write-Warning "Retrying without the Persian wizard"
            Remove-Item Farsi.isl
            & $iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer.iss
          }
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Zip portable version
        run: Compress-Archive -Path dist\DeskPresence -DestinationPath DeskPresence_Portable.zip

      - name: Collect files
        run: Copy-Item Output\DeskPresence_Setup.exe .

      # Every build (any branch, pull requests, main, tags) keeps its output for two weeks:
      # Actions -> the run -> Artifacts.
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPresence-Windows-${{ steps.ver.outputs.version }}
          path: |
            DeskPresence_Setup.exe
            DeskPresence_Portable.zip
          retention-days: 14

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Decide the version
        id: ver
        run: |
          version=$(python3 tools/set_version.py --ci "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Signed with the repository's key when the ANDROID_KEYSTORE_* secrets exist (so updates
      # install over older versions); otherwise with a throw-away debug key.
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon
          -PappVersion=${{ steps.ver.outputs.version }}
          -PappVersionCode=${{ github.run_number }}
          ${KEYSTORE_FILE:+-PkeystoreFile=$KEYSTORE_FILE -PkeystorePassword=$KEYSTORE_PASSWORD -PkeyAlias=$KEY_ALIAS -PkeyPassword=$KEY_PASSWORD}

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DeskPresence-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPresence-Android-${{ steps.ver.outputs.version }}
          path: DeskPresence-Android.apk
          retention-days: 14

  release:
    needs: [windows, android]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Checksums
        run: |
          cd out
          sha256sum DeskPresence_Setup.exe DeskPresence_Portable.zip DeskPresence-Android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Tag this build
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          tag="v${{ needs.windows.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "DeskPresence $tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.windows.outputs.version }}
          name: DeskPresence v${{ needs.windows.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            out/DeskPresence_Setup.exe
            out/DeskPresence_Portable.zip
            out/DeskPresence-Android.apk
            out/SHA256SUMS.txt
