name: Build EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download face model
        run: python scripts/download_model.py

      - name: Syntax check
        run: python -m compileall -q deskpresence

      - name: Build with PyInstaller
        run: >
          pyinstaller --noconfirm --onefile --windowed --name DeskPresence
          --add-data "assets/face_detection_yunet_2023mar.onnx;assets"
          --collect-submodules winrt
          --hidden-import pystray._win32
          run.py

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPresence
          path: dist/DeskPresence.exe

      - name: Publish release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DeskPresence.exe
