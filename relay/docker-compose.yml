# DeskPresence relay + Caddy (automatic HTTPS with Let's Encrypt).
#   DOMAIN=deskpresence.example.com docker compose up -d --build
services:
  relay:
    build: .
    restart: unless-stopped
    volumes:
      - relay-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN, e.g. deskpresence.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - relay

volumes:
  relay-data:
  caddy-data:
